<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow"><title>주동목 — 모바일 체험 V3</title><style>
:root{color-scheme:light;--blue:#235BFA;--blue-dark:#1245D4;--navy:#121D36;--muted:#76829A;--border:#DFE6F1;--pale:#F2F6FF;--surface:#F7F9FD;--success:#0D9B70;--wrong:#C7464A}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100vh;background:#f0f3fa;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;color:var(--navy);font-size:18px;letter-spacing:-.04em}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #88AAFF;outline-offset:3px}button:disabled{cursor:default}
.screen{background:#fff;max-width:535px;min-height:100dvh;margin:0 auto;position:relative;box-shadow:0 26px 75px rgba(21,36,77,.09);display:flex;flex-direction:column}
.header{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #F0F3F8;flex-shrink:0}
.logo{font-weight:900;letter-spacing:-.07em;font-size:26px;display:flex;align-items:center;gap:9px}
.logo-mark{display:grid;grid-template-columns:repeat(3,6px);gap:3px;align-items:end;height:20px;width:26px;transform:rotate(-9deg)}
.logo-mark i{display:block;width:6px;height:11px;background:var(--blue);border-radius:2px}.logo-mark i:nth-child(2){height:20px}.logo-mark i:nth-child(3){height:15px}
.top-action{border:0;background:transparent;color:#8994A9;font-size:15px;font-weight:700;padding:12px 3px}
main{flex:1;display:flex;flex-direction:column;padding:0 30px 34px;min-width:0}
.progress-wrap{padding-top:25px}
.progress-heading{display:flex;justify-content:space-between;align-items:center;color:#7B869B;font-size:14px;font-weight:700;letter-spacing:0}
.progress-heading b{color:var(--blue);font-size:15px}
.progress-bar{display:flex;gap:7px;margin-top:13px}
.progress-segment{height:7px;border-radius:8px;flex:1;background:#E6EBF3;overflow:hidden}
.progress-segment span{display:block;height:100%;width:0;background:var(--blue);border-radius:8px;transition:width .34s cubic-bezier(.15,.65,.3,1)}
.hero{padding-top:47px}
.hero-label{font-size:14px;color:var(--blue);font-weight:850;letter-spacing:.02em;margin-bottom:15px}
.hero h1{font-size:clamp(28px,6.5vw,35px);line-height:1.46;letter-spacing:-.065em;margin:0;font-weight:850;word-break:keep-all;color:#111A30}
.board{margin-top:34px;background:var(--pale);border:1px solid #E4ECFF;border-radius:15px;padding:21px 19px 19px;min-height:145px}
.board-heading{font-size:13px;font-weight:800;color:#6C83BB;letter-spacing:0;margin-bottom:16px}
.slots{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}
.slot{min-width:73px;border:1px solid #D4DEF7;background:#fff;border-radius:9px;padding:10px 11px 11px;transition:background .2s,border .2s,transform .18s}
.slot-label{font-size:12px;font-weight:700;color:#98A4BC;letter-spacing:0;margin-bottom:5px;line-height:1}
.slot-word{font-size:23px;letter-spacing:-.025em;font-weight:850;line-height:1.2;white-space:nowrap;color:#C0CADD}
.slot.filled{border-color:#BBCFFF;background:white;animation:pop .22s ease-out both}
.slot.filled .slot-word{color:var(--blue)}
.slot.extra{background:#E8F0FF;border-color:#B8CFFF}.slot.extra .slot-word{font-size:17px}
.question-area{margin-top:38px;min-width:0}
.step-info{display:flex;align-items:center;gap:8px;font-size:14px;color:#71819A;font-weight:750;letter-spacing:0;margin-bottom:10px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.question-area h2{font-size:28px;letter-spacing:-.065em;line-height:1.32;font-weight:850;margin:0 0 24px;word-break:keep-all}
.answers{display:grid;gap:12px}
.answer{min-height:84px;width:100%;border:1.5px solid #E1E7F1;border-radius:12px;background:#fff;padding:15px 17px;text-align:left;display:flex;align-items:center;gap:15px;color:var(--navy);transition:background .15s,border .15s,transform .12s,box-shadow .15s}
.answer:hover{border-color:#97B3FA;background:#FBFCFF;box-shadow:0 5px 20px rgba(24,72,179,.055)}
.answer:active{transform:scale(.991)}
.answer-no{border:1px solid #DCE4F1;background:#F8FAFD;color:#7D8BA4;font-size:14px;font-weight:850;width:33px;height:33px;border-radius:8px;flex:none;display:grid;place-items:center;letter-spacing:0}
.answer-content{display:flex;min-width:0;flex:1;flex-direction:column;gap:4px}
.answer-name{font-size:24px;font-weight:850;letter-spacing:-.045em;line-height:1.1;overflow-wrap:anywhere}
.answer-meaning{font-size:15px;font-weight:650;color:#8590A4;line-height:1.25}
.answer svg{color:#CBD5E4;flex-shrink:0}
.answer.correct{background:#EEF9F5;border-color:#49BB91}.answer.correct .answer-no{background:var(--success);border-color:var(--success);color:white}.answer.correct .answer-name{color:#066F50}
.answer.wrong{border-color:#E99A9C;background:#FFF7F7}.answer.wrong .answer-no{color:var(--wrong);border-color:#E99A9C}
.feedback{min-height:33px;margin-top:14px;font-size:16px;font-weight:750;color:var(--success);line-height:1.4}
.feedback.wrong{color:var(--wrong)}
.skip{border:0;background:transparent;color:#77859B;font-size:16px;font-weight:750;text-decoration:underline;text-underline-offset:4px;display:block;margin:18px auto 0;padding:9px 15px}
.bottom-note{font-size:13px;color:#A1A9B7;text-align:center;padding:17px 16px 23px;flex-shrink:0;letter-spacing:0}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:520px;position:relative;padding:28px 0 10px}
.success-icon{margin:0 auto 21px;border-radius:50%;height:78px;width:78px;display:grid;place-items:center;background:#EAF8F2;color:var(--success);position:relative;animation:pop .38s both}
.success-icon:after{position:absolute;content:"";width:94px;height:94px;border:1.5px solid #BEEBD5;border-radius:50%;animation:ring .6s both}
.done-kicker{text-align:center;color:var(--success);font-size:15px;font-weight:850;margin:0 0 9px;letter-spacing:.02em}
.done h2{font-size:34px;letter-spacing:-.07em;text-align:center;margin:0 0 36px;font-weight:850;line-height:1.3}
.result{border-radius:15px;background:var(--blue);color:white;padding:30px 28px;box-shadow:0 15px 30px rgba(35,91,250,.16);overflow-wrap:anywhere;position:relative}
.result::after{content:'';position:absolute;border:1px solid rgba(255,255,255,.12);width:185px;height:185px;border-radius:50%;right:-85px;top:-112px}
.result .minor{font-size:13px;color:#D9E4FF;font-weight:750;letter-spacing:.07em;margin-bottom:14px}
.result .big-sentence{font-size:clamp(29px,5.6vw,39px);font-weight:800;line-height:1.45;letter-spacing:-.045em}
.result .big-sentence em{font-style:normal;color:#D0F4FF}
.translation{font-size:16px;line-height:1.5;color:#76849B;margin:17px 1px 25px;text-align:center}
.extra-actions{display:flex;gap:10px;margin:0 0 16px}
.utility{background:#fff;border:1px solid #DCE4F1;border-radius:11px;flex:1;font-size:16px;font-weight:750;color:#3A4C6D;min-height:55px;display:flex;align-items:center;gap:8px;justify-content:center}
.utility svg{height:20px;width:20px;stroke-width:2}
.primary{width:100%;min-height:66px;background:var(--blue);color:#fff;border:0;border-radius:12px;font-size:21px;font-weight:850;letter-spacing:-.04em;box-shadow:0 7px 18px rgba(35,91,250,.17);transition:transform .15s,background .15s}
.primary:hover{background:var(--blue-dark)}.primary:active{transform:scale(.985)}
.recap{padding-top:45px}.recap-head{font-size:33px;letter-spacing:-.06em;margin:14px 0 29px}.recap-sub{color:var(--blue);font-size:14px;font-weight:850}
.recap-line{padding:22px 0;border-bottom:1px solid #E8EDF4}.recap-line small{color:#8A98AA;font-weight:800;font-size:14px}.recap-line strong{display:block;font-size:23px;line-height:1.45;letter-spacing:-.045em;margin-top:8px;overflow-wrap:anywhere}
.recap .primary{margin-top:35px}
@keyframes pop{0%{transform:scale(.89);opacity:.35}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{transform:scale(.65);opacity:.1}100%{transform:scale(1);opacity:1}}
@media(max-width:550px){body{background:#fff}.screen{box-shadow:none}.header{padding:0 22px;height:70px}main{padding:0 22px 22px}.progress-wrap{padding-top:21px}.hero{padding-top:40px}.hero h1{font-size:30px}.board{margin-top:28px}.question-area{margin-top:35px}.question-area h2{font-size:27px;margin-bottom:21px}.answer{min-height:80px}.done{min-height:480px}}
@media(max-width:380px){main{padding-left:17px;padding-right:17px}.header{padding:0 17px}.hero h1{font-size:28px}.board{padding:18px 14px}.slot{padding:9px;min-width:67px}.question-area{margin-top:29px}.question-area h2{font-size:25px}.answer{min-height:75px;padding:12px}.answer-name{font-size:22px}}
@media(min-width:560px){.screen{min-height:790px;margin:36px auto;border:1px solid #E5EAF2;border-radius:21px;overflow:hidden}.bottom-note{padding-bottom:20px}}
.privacy-link{color:#7B86A0;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* Only the minimum styles needed to extend the original v08 UI */
.intro{padding-top:clamp(110px,20dvh,210px)}
.intro h1{font-size:clamp(29px,6.3vw,35px);font-weight:850;line-height:1.5;letter-spacing:-.065em;word-break:keep-all;margin:0 0 38px;color:#111A30;animation:appear .55s ease forwards .16s}
.intro .answer{animation:appear .4s ease forwards}
.intro .answer:nth-child(1){animation-delay:.64s}
.intro .answer:nth-child(2){animation-delay:.96s}
.intro .answer:nth-child(3){animation-delay:1.28s}
.intro .primary{animation:appear .5s ease both .25s}
@keyframes appear{from{opacity:.75;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.hero.korean-hero h1{display:flex;gap:.18em;flex-wrap:wrap;align-items:center}
.korean-token{display:inline;padding:1px 3px;border-radius:6px;transition:background .18s,color .18s}
.korean-token.lit{background:#FFE27A;color:#1E2540;box-shadow:0 0 0 2px rgba(255,211,63,.22)}
.board{min-height:0}
.slot{min-width:73px}
.question-area{margin-top:31px}
.question-area h2{font-size:26px}
.answer{min-height:73px}
.answer-name{font-size:22px}
.done{min-height:0;justify-content:center}
@media(max-width:550px){.intro{padding-top:clamp(100px,18dvh,170px)}.question-area h2{font-size:25px}.answer{min-height:73px}}
@media(prefers-reduced-motion:reduce){.intro h1,.intro .answer{animation:none;opacity:1}}

.board{padding-top:23px;padding-bottom:23px}
.slot{display:flex;align-items:center;justify-content:center;min-height:57px}
.slot-word{font-size:25px}
.question-area{margin-top:32px}
/* Completion celebration: built on original v08 result card */
.done .success-icon{height:92px;width:92px;background:#eaf8f2;animation:victory-pop .65s cubic-bezier(.16,1.3,.3,1) both}
.done .success-icon::before{content:"";position:absolute;inset:-15px;border:3px solid rgba(29,180,120,.17);border-radius:50%;animation:victory-ring .8s ease-out both}
.done h2{animation:victory-rise .55s ease both .10s}
.done .result{animation:victory-rise .65s cubic-bezier(.18,.8,.2,1) both .2s}
.done .result .big-sentence{font-size:clamp(26px,6vw,36px)}
.done-buttons{display:flex;gap:9px;margin:0 0 12px}
.done-buttons .utility{min-height:62px}
.done-buttons .utility:first-child{flex:1.3}
.done-buttons .utility:last-child{flex:0.8}
.celebrate-layer{position:absolute;z-index:30;inset:0;overflow:hidden;pointer-events:none}
.celebrate-bit{position:absolute;top:25%;left:50%;width:9px;height:15px;opacity:0;will-change:transform,opacity;animation:celebrate-fly var(--time,2000ms) cubic-bezier(.1,.58,.23,1) forwards var(--delay,0ms)}
@keyframes celebrate-fly{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.8)}
 35%{opacity:1}
 100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--turn)) scale(.65)}}
@keyframes victory-pop{0%{transform:scale(.45);opacity:.2}65%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes victory-rise{0%{opacity:0;transform:translateY(19px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes victory-ring{from{transform:scale(.55);opacity:1}to{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.celebrate-layer{display:none}.done .success-icon,.done h2,.done .result,.done .success-icon::before{animation:none}}

/* Quiet v08 labels above filled slots: readability without extra instructional text */
.board{padding:18px 16px 17px}
.slots{gap:8px}
.slot{min-width:65px;min-height:65px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:9px 12px 10px}
.slot-label{font-size:11px;letter-spacing:.015em;font-weight:800;margin:0 0 7px;color:#9aa6bd}
.slot.filled .slot-label{color:#7489b3}
.slot-word{font-size:24px;line-height:1.15}
.slot.extra{background:#edf3ff}
.slot.extra .slot-word{font-size:18px;white-space:normal}
@media(max-width:380px){.board{padding:16px 13px}.slot{padding:8px 10px;min-width:58px}.slot-word{font-size:22px}.slot.extra .slot-word{font-size:17px}}
 .slot.no-label{min-height:60px;justify-content:center;align-items:center}

/* Home and focused practice, reusing v08 palette and controls */
.slot.no-label{min-height:61px;align-items:center;justify-content:center}
.intro .simple-line{font-size:26px;font-weight:850;letter-spacing:-.04em;background:var(--pale);padding:20px 22px;border-radius:12px;margin:-8px 0 26px;color:var(--blue)}
.intro .primary{animation:appear .45s ease both .2s}
.sentence-board{padding:26px 22px;min-height:90px}

.compare-old{text-align:center;color:#8895ae;font-weight:750;font-size:19px;margin:0 0 13px}
.home{padding-top:48px}
.home-label{font-size:14px;color:var(--blue);font-weight:850;letter-spacing:0;margin-bottom:13px}
.home h1,.subpage h1{font-size:clamp(30px,7vw,36px);line-height:1.4;letter-spacing:-.065em;margin:0 0 29px;font-weight:850}
.home-course{border:1px solid #E1E8F4;background:#F8FAFF;border-radius:16px;padding:24px 21px;margin:0 0 19px}

/* Celebrations stay in the visible viewport on mobile */
.celebrate-layer{position:fixed;inset:0;z-index:9999;overflow:hidden;pointer-events:none}

function speak(text){
 // Embedded mobile browsers may not expose speech synthesis. Never interrupt learning.
 if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined")return false;
 try{
  const synth=window.speechSynthesis;
  synth.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="en-US";utterance.rate=.87;
  const voices=typeof synth.getVoices==="function"?synth.getVoices():[];
  utterance.voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang?.startsWith("en"))||null;
  synth.speak(utterance);
  return true;
 }catch(e){return false;}
}

const speechFiles=new Map();
let currentAudio=null;
async function playEnglish(text,button){
 if(!text||!button)return false;
 const original=button.textContent;
 button.parentElement?.querySelectorAll(".audio-hint").forEach(x=>x.remove());
 button.disabled=true;button.textContent="🔄 음원 준비 중...";
 try{
  let url=speechFiles.get(text);
  if(!url){
   const response=await fetch("/.netlify/functions/jm-audio",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text})});
   if(response.ok){
    url=URL.createObjectURL(await response.blob());
    speechFiles.set(text,url);
    if(speechFiles.size>16){const [oldKey,oldUrl]=speechFiles.entries().next().value;speechFiles.delete(oldKey);URL.revokeObjectURL(oldUrl);}
   }
  }
  if(url){
   try{currentAudio?.pause();}catch(e){}
   const holder=document.createElement("div");holder.className="inline-audio";
   const audio=document.createElement("audio");audio.controls=true;audio.preload="metadata";audio.setAttribute("playsinline","");
   audio.src=url;holder.appendChild(audio);
   const previous=button.parentElement?.querySelector(".inline-audio");if(previous)previous.remove();
   button.insertAdjacentElement("afterend",holder);currentAudio=audio;
   try{await audio.play();}catch(e){
    const hint=document.createElement("p");hint.className="audio-hint";
    hint.textContent="음원이 준비됐어요. ▶ 버튼을 눌러주세요.";holder.appendChild(hint);
   }
   return true;
  }
  // Without a server API key, use browser speech if the mobile browser supports it.
  if(!/kakaotalk/i.test(navigator.userAgent||"")&&speak(text))return true;
  const hint=document.createElement("p");hint.className="audio-hint";
  hint.textContent="카카오톡에서 음성이 안 나오면 ⋯ → 다른 브라우저로 열기를 선택해 주세요.";
  button.insertAdjacentElement("afterend",hint);
  return false;
 }catch(e){
  if(!/kakaotalk/i.test(navigator.userAgent||"")&&speak(text))return true;
  const hint=document.createElement("p");hint.className="audio-hint";
  hint.textContent="음원을 불러올 수 없어요. 잠시 후 다시 시도하거나 다른 브라우저에서 열어주세요.";
  button.insertAdjacentElement("afterend",hint);
  return false;
 }finally{button.disabled=false;button.textContent=original;}
}

function victorySound(){
 const c=unlockAudio();if(!c||c.state==="closed")return;
 const notes=[523.25,659.26,783.99,1046.5,1318.51];
 const start=c.currentTime+.025;
 notes.forEach((freq,i)=>{
  const o=c.createOscillator(),g=c.createGain(),at=start+i*.105;
  o.type=i===4?"sine":"triangle";o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.035,at+.022);
  g.gain.exponentialRampToValueAtTime(.0001,at+.34);

}
function celebrate(force=false,mini=false){
 // A small inline response for exercise completions: never cover the next question.
 if(mini){
  const feedback=app.querySelector(".feedback");
  if(feedback){feedback.classList.add("inline-spark");feedback.textContent="✨ 문장 완성!";}
  return;
 }
 // The big reward is attached to the existing completion badge, not a fullscreen overlay.
 const badge=app.querySelector(".done .success-icon");
 if(!badge)return;
 badge.querySelector(".badge-confetti")?.remove();
 badge.classList.remove("badge-pop");
 // Restart animation when explicitly replayed.
 void badge.offsetWidth;
 badge.classList.add("badge-pop");
 if(window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches)return;
 const group=document.createElement("span");
 group.className="badge-confetti";group.setAttribute("aria-hidden","true");
 const colors=["#235BFA","#FFD44D","#15B786","#FE779E","#9F7BFF"];
 for(let i=0;i<22;i++){
  const bit=document.createElement("i");
  bit.className="badge-confetti-bit";
  bit.style.backgroundColor=colors[i%colors.length];
  const angle=i*Math.PI*2/22;
  bit.style.setProperty("--dx",(Math.cos(angle)*(68+(i%5)*12)).toFixed(0)+"px");
  bit.style.setProperty("--dy",(Math.sin(angle)*(65+(i%4)*12)).toFixed(0)+"px");
  bit.style.setProperty("--r",(i*137)+"deg");
  bit.style.setProperty("--delay",((i%4)*30)+"ms");
  group.appendChild(bit);
 }
 badge.appendChild(group);
 setTimeout(()=>group.remove(),1750);
}

function diaryProblem(message){diaryBusy=false;diaryError=message;renderDiary();}
function diaryStore(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error("INDEXED_DB_UNAVAILABLE"));return;}
  const req=indexedDB.open("judongmok-diary-audio-v1",1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("clips"))req.result.createObjectStore("clips");};
  req.onerror=()=>reject(req.error||new Error("DB_OPEN_FAILED"));
  req.onsuccess=()=>resolve(req.result);
 });
}
async function saveDiaryClip(id,blob){
 const db=await diaryStore();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction("clips","readwrite");tx.objectStore("clips").put(blob,id);
  tx.oncomplete=()=>{db.close();resolve();};
  tx.onerror=()=>{db.close();reject(tx.error||new Error("DB_WRITE_FAILED"));};
 });
}
async function fetchDiaryClip(id){
 const db=await diaryStore();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction("clips","readonly"),req=tx.objectStore("clips").get(id);
  req.onsuccess=()=>{db.close();resolve(req.result||null);};
  req.onerror=()=>{db.close();reject(req.error||new Error("DB_READ_FAILED"));};
 });
}

  renderDiary();
 }catch(e){
  diaryProblem("녹음 저장에 실패했어요. 브라우저 저장 공간을 확인하거나 다른 브라우저에서 시도해 주세요.");
 }
}
function diaryCancelRecording(){
 if(diaryRecorder&&diaryRecorder.state==="recording"){
  diaryRecorder.ondataavailable=null;diaryRecorder.onstop=null;
  try{diaryRecorder.stop();}catch(e){}
 }
 try{diaryStream?.getTracks().forEach(track=>track.stop());}catch(e){}
 diaryRecorder=null;diaryStream=null;diaryChunks=[];
}
function diaryStopRecording(){
 if(diaryRecorder&&diaryRecorder.state==="recording")diaryRecorder.stop();
}
async function diaryToggleRecord(kind){
 if(diaryRecorder&&diaryRecorder.state==="recording"){diaryStopRecording();return;}
 if(diaryBusy)return;
 diaryCaptureFields();
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){
  diaryProblem("마이크를 사용할 수 없어요. 글로 적거나 다른 브라우저에서 열어주세요.");return;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported?.(t));
  const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  diaryRecorder=recorder;diaryStream=stream;diaryRecordKind=kind;diaryChunks=[];
  recorder.ondataavailable=ev=>{if(ev.data&&ev.data.size>0)diaryChunks.push(ev.data);};
  recorder.onstop=()=>{
   stream.getTracks().forEach(track=>track.stop());
   const blob=new Blob(diaryChunks,{type:recorder.mimeType||"audio/webm"});
   diaryRecorder=null;diaryStream=null;diaryChunks=[];
   if(kind==="ko"){let upload=blob;try{upload=new File([blob],blob.type.includes("mp4")?"diary.m4a":"diary.webm",{type:blob.type});}catch(e){upload.name=blob.type.includes("mp4")?"diary.m4a":"diary.webm";}diaryTranscribe(upload);}
   else{
    diaryEnglishBlob=blob;
    if(diaryPreviewUrl)URL.revokeObjectURL(diaryPreviewUrl);
    diaryPreviewUrl=URL.createObjectURL(blob);diaryError="";renderDiary();
   }
  };
  recorder.start();diaryError="";renderDiary();
  // 45-second maximum, never record indefinitely without an explicit stop.
  setTimeout(()=>{if(diaryRecorder===recorder&&recorder.state==="recording")recorder.stop();},45000);
 }catch(e){diaryProblem("마이크가 안 되면 글로 적어주세요. 영어 일기는 녹음 없이 저장할 수 있어요.");}
}
async function diaryPlaySaved(i,button){
 const entry=diaryEntries[i];if(!entry)return;
 try{
  const blob=await fetchDiaryClip(entry.id);
  if(!blob){diaryError="녹음 파일을 찾지 못했어요. 다른 기기에서 저장된 기록은 가져올 수 없어요.";return;}
  const url=URL.createObjectURL(blob);
  const player=document.createElement("audio");player.controls=true;player.src=url;player.setAttribute("playsinline","");
  const old=button.parentElement?.parentElement?.querySelector("audio");if(old)old.remove();
  button.parentElement?.parentElement?.appendChild(player);
  player.onended=()=>URL.revokeObjectURL(url);
  try{await player.play();}catch(e){}
 }catch(e){button.textContent="녹음 확인 불가";}
}
async function diaryAction(which,button){
 if(which==="diary-record-ko")return diaryToggleRecord("ko");
 if(which==="diary-record-en")return diaryToggleRecord("en");
 if(which==="diary-convert")return diaryConvert();
 if(which==="diary-save")return diarySave();
 if(which==="diary-list"){diaryCaptureFields();scene="diary-library";render();window.scrollTo(0,0);return;}
 if(which==="diary-new"){diaryReset();scene="diary";render();return;}
 if(which==="diary-edit-korean"){diaryCaptureFields();diaryStep="korean";diaryError="";renderDiary();return;}
 if(which==="diary-listen"){diaryCaptureFields();if(diaryEnglish.trim())playEnglish(diaryEnglish.trim(),button);return;}
 if(which==="diary-listen-entry"){const x=diaryEntries[Number(button.dataset.index)];if(x)playEnglish(x.english,button);return;}
 if(which==="diary-play-entry")return diaryPlaySaved(Number(button.dataset.index),button);
}

mainTabs.addEventListener("click",e=>{const el=e.target.closest("button[data-action]");if(el&&!el.disabled&&el.getAttribute("aria-current")!=="page")action(el.dataset.action,el);});
app.addEventListener("click",e=>{
 const el=e.target.closest("button");if(!el||el.disabled)return;
 if(el.hasAttribute("data-kind"))clickChoice(el.dataset.kind,Number(el.dataset.index),el);
 else if(el.hasAttribute("data-action"))action(el.dataset.action,el);
});
app.addEventListener("input",e=>{
 if(e.target.id==="diary-korean"){diaryKorean=e.target.value;saveDiaryDraft();}
 if(e.target.id==="diary-english"){diaryEnglish=e.target.value;saveDiaryDraft();}
});

render();
})();
</script></body></html>

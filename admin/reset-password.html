<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>주동목 관리자 비밀번호 재설정</title>
<style> *{box-sizing:border-box}body{font:17px/1.6 system-ui,sans-serif;background:#f6f7f9;color:#18243a;margin:0;padding:24px 16px}main{max-width:420px;margin:32px auto;background:white;padding:24px;border:1px solid #e2e5ec;border-radius:16px}h1{font-size:26px;line-height:1.4}label{display:block;margin:12px 0 5px}input,button{width:100%;min-height:52px;font:inherit;border-radius:9px;padding:10px 12px}input{border:1px solid #b9c3d2}button{margin:16px 0;background:#235bfa;color:white;border:none;font-weight:600}button:disabled{opacity:.55}a{color:#1949be}#status{overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body>
<main><h1>관리자 비밀번호 재설정</h1><p id="status" role="status">이메일로 새 재설정 링크를 받으세요.</p>
<form id="request"><label for="email">관리자 이메일</label><input id="email" type="email" autocomplete="email" required><button>재설정 이메일 보내기</button></form>
<form id="change" hidden><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button>비밀번호 변경</button></form>
<a href="./">관리자 로그인으로 돌아가기</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://plgaumvzuoiiisbzwcei.supabase.co';
const KEY='sb_publishable_xZB3mERXFTB-wl1BRSMhsg_Zc31XeyL';
const params=new URLSearchParams(location.hash.slice(1));
const recovery=params.get("type")==="recovery"&&!!params.get("access_token");
const invalid=params.has("error")||params.has("error_code");
const request=document.getElementById("request"),change=document.getElementById("change"),status=document.getElementById("status");
let recoveryReady=false;
const client=window.supabase?.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:true,flowType:"implicit",storageKey:"judongmok:admin:recovery:v1"}});
function showRecovery(){if(invalid||!recovery)return;recoveryReady=true;request.hidden=true;change.hidden=false;status.textContent="새 비밀번호를 입력하세요. 12자 이상을 권장합니다.";}
if(!client){status.textContent="인증 서비스 연결에 실패했습니다. 새로고침해 주세요.";request.querySelector("button").disabled=true;}
else{
 client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)showRecovery();});
 if(invalid){status.textContent="링크가 만료되었거나 이미 사용되었습니다. 새 이메일을 요청해 주세요.";history.replaceState(null,"",location.pathname);}
 else if(recovery){request.hidden=true;status.textContent="재설정 링크를 확인하고 있습니다.";client.auth.getSession().then(({data,error})=>{if(error||!data.session){request.hidden=false;status.textContent="링크를 확인하지 못했습니다. 새 이메일을 요청해 주세요.";}else showRecovery();history.replaceState(null,"",location.pathname);}).catch(()=>{request.hidden=false;status.textContent="연결에 실패했습니다. 새 이메일을 요청해 주세요.";});}
 request.addEventListener("submit",async e=>{e.preventDefault();const b=request.querySelector("button");b.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById("email").value.trim(),{redirectTo:location.origin+location.pathname});status.textContent=error?"요청하지 못했습니다. 잠시 후 다시 시도해 주세요.":"메일함을 확인하고 가장 최근 재설정 링크를 열어주세요.";}catch{status.textContent="연결에 실패했습니다. 다시 시도해 주세요.";}finally{b.disabled=false;}});
 change.addEventListener("submit",async e=>{e.preventDefault();if(!recoveryReady)return;const p=document.getElementById("password"),c=document.getElementById("confirm");if(p.value!==c.value){status.textContent="비밀번호가 서로 다릅니다.";return;}const b=change.querySelector("button");b.disabled=true;try{const {error}=await client.auth.updateUser({password:p.value});if(error){status.textContent="변경하지 못했습니다. 새 재설정 링크를 받아 다시 시도해 주세요.";return;}p.value=c.value="";change.hidden=true;recoveryReady=false;status.textContent="비밀번호가 변경되었습니다. 관리자 로그인으로 돌아가세요.";try{await client.auth.signOut({scope:"local"});}catch{}}catch{status.textContent="연결에 실패했습니다. 다시 시도해 주세요.";}finally{b.disabled=false;}});
}
</script></body></html>

      lesson_type:entry.lesson_type,started_at:entry.started_at,
      last_activity_at:entry.last_activity_at,completed_at:entry.completed_at,
      last_step:entry.last_step,status:entry.status,mistakes:entry.mistakes
    },{onConflict:'id'}));
   }else {cloudQueue.shift();saveQueue();continue;}
   if(error)throw error;
   // The user may have advanced while this network request was in flight.
   // Only discard the exact snapshot that the server confirmed.
   if(cloudQueue[0]===entry)cloudQueue.shift();
   saveQueue();
  }
  statusText('학습 기록 온라인 저장됨');
 }catch(err){
  // Retain items in localStorage and retry on a later online visit.
  console.warn('주동목 온라인 기록 저장 대기:',err?.message||err);
  statusText('기기에 저장됨 · 온라인 연결 대기');
 }finally{cloudSending=false}
}
async function startCloud(){
 try{await connectCloud();await flushCloud()}catch(e){/* offline or auth error; offline-first */}
}
window.addEventListener('online',()=>{void startCloud()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void startCloud()});

// v0.7: one attempt per actual first answer; repeated practice creates a new UUID.
let activeAttempt=null;
function beginAttempt(){
 if(activeAttempt)return;
 const now=new Date().toISOString();
 const raw=crypto.getRandomValues(new Uint8Array(16));raw[6]=(raw[6]&15)|64;raw[8]=(raw[8]&63)|128;
 const uuid=[...raw].map(x=>x.toString(16).padStart(2,'0')).join('');
 const attemptId=`${uuid.slice(0,8)}-${uuid.slice(8,12)}-${uuid.slice(12,16)}-${uuid.slice(16,20)}-${uuid.slice(20)}`;
 activeAttempt={id:attemptId,lesson_day:day+1,lesson_type:lesson===0?'be':'general',
  started_at:now,last_activity_at:now,completed_at:null,last_step:step,status:'started',mistakes:0};
 enqueueCloud({kind:'session',...activeAttempt});
}
function touchAttempt(nextStep=step,finalStatus=null){
 if(!activeAttempt)return;
 const now=new Date().toISOString();
 activeAttempt={...activeAttempt,last_step:nextStep,last_activity_at:now,mistakes,
  ...(finalStatus?{status:finalStatus,completed_at:finalStatus==='completed'?now:null}:{})};
 enqueueCloud({kind:'session',...activeAttempt});
 if(finalStatus)activeAttempt=null;
}
function interruptAttempt(){if(activeAttempt)touchAttempt(step,'interrupted')}

const header=()=>`<div class="progress-wrap"><div class="progress-heading"><span>${day+1}일차 · ${lesson===0?'be동사':'일반동사'}</span><span><b>${dayResults().length}</b> / 2문장 완료</span></div><div class="progress-bar"><div class="progress-segment"><span style="width:${(dayResults().length/2)*100}%"></span></div><div class="progress-segment"><span style="width:${dayResults().length?100:0}%"></span></div></div></div>`;
const board=()=>{const l=lessonData();let slots=[['주어',picked.s],['동사',picked.v]];if(lesson===0)slots.push(['설명',picked.c]);if(lesson===1&&l.need)slots.push(['목적어',picked.o]);if(extra)slots.push(['추가정보',extra[0]]);return `<div class="board"><div class="board-heading">내가 조립한 문장</div><div class="slots">${slots.map(([name,w])=>`<div class="slot ${w?'filled':''} ${name==='추가정보'?'extra':''}"><div class="slot-label">${name}</div><div class="slot-word">${w?safe(w):'···'}</div></div>`).join('')}</div></div>`};
const item=(t,desc,i)=>`<button type="button" class="answer" data-choice="${safe(t)}"><span class="answer-no">${i+1}</span><span class="answer-content"><span class="answer-name">${safe(t)}</span>${desc?`<span class="answer-meaning">${safe(desc)}</span>`:''}</span></button>`;
function stage(){const l=lessonData();
 const cfg={subject:['주어','누가 주인공일까요?'],verb:['동사',lesson===0?'어떤 be동사를 쓸까요?':'무엇을 하나요?'],comp:['주어 설명','주어를 어떻게 설명할까요?'],need:['목적어','이 문장에 목적어를 넣을까요?'],object:['목적어','무엇을?'],extra:['추가정보','한 가지 더 붙여볼까요?']};
 let options=[],[tag,question]=cfg[step];
 if(step==='subject') options=[[l.s,'정답'],[l.sAlt,'']];
 if(step==='verb')options=[[l.v,''],[l.vAlt,'']];
 if(step==='comp')options=[[l.c,l.cDesc],[l.cAlt,'']];
 if(step==='need')options=[['네, 넣을게요',''],['아니요, 없어도 돼요','']];
 if(step==='object')options=[[l.o,''],[l.oAlt,'']];
 if(step==='extra')options=l.extras.map(([word,meaning])=>[word,meaning]);
 // Display distractors in alternating order so position cannot be memorized.
 if((day+lesson+(step==='verb'?1:0)+(step==='object'?1:0))%2===1)options.reverse();
 if(step==='subject')options=options.map(([w])=>[w,'']);
 app.innerHTML=header()+`<section class="hero"><div class="hero-label">${lesson===0?'01 · be동사':'02 · 일반동사'}</div><h1>${safe(l.ko)}</h1></section>`+board()+`<section class="question-area"><div class="step-info"><span class="step-dot"></span>${tag}</div><h2>${question}</h2><div class="answers">${options.map(([t,d],i)=>item(t,d,i)).join('')}</div>${step==='extra'?'<button type="button" class="skip" data-action="no-extra">추가하지 않고 완성하기</button>':''}<p class="feedback" id="answer-feedback" aria-live="polite"></p></section>`;
}
function audioGood(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),osc=ac.createOscillator(),gn=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(530,ac.currentTime);osc.frequency.linearRampToValueAtTime(770,ac.currentTime+.14);gn.gain.setValueAtTime(.018,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.19);osc.connect(gn);gn.connect(ac.destination);osc.start();osc.stop(ac.currentTime+.19);osc.onended=()=>ac.close()}catch(e){}}
function success(btn,go){busy=true;btn.classList.add('correct');btn.querySelector('.answer-no').textContent='✓';$('#answer-feedback').textContent='좋아요!';audioGood();try{navigator.vibrate?.(15)}catch(e){};setTimeout(()=>{go();touchAttempt(step);busy=false;render()},320)}
function wrong(btn,txt){mistakes++;touchAttempt(step);btn.classList.add('wrong');$('#answer-feedback').classList.add('wrong');$('#answer-feedback').textContent=txt||'다시 골라보세요.';setTimeout(()=>btn.classList.remove('wrong'),540)}
function pick(btn,w){if(busy)return;beginAttempt();const l=lessonData();
 if(step==='subject'){if(w!==l.s)return wrong(btn,'누가 행동하는지 한국어 문장을 보세요.');return success(btn,()=>{picked.s=w;step='verb'})}
 if(step==='verb'){if(w!==l.v)return wrong(btn,'주어에 어울리는 동사를 골라보세요.');return success(btn,()=>{picked.v=w;step=lesson===0?'comp':'need'})}
 if(step==='comp'){if(w!==l.c)return wrong(btn,'한국어 문장의 의미를 다시 보세요.');return success(btn,()=>{picked.c=w;step='extra'})}
 if(step==='need'){const yes=w==='네, 넣을게요';if(yes!==l.need)return wrong(btn,l.need?'이 문장에는 행동의 대상이 있어요.':'이 문장에는 목적어가 없어도 돼요.');return success(btn,()=>{step=l.need?'object':'extra'})}
 if(step==='object'){if(w!==l.o)return wrong(btn,'한국어 문장의 대상을 확인하세요.');return success(btn,()=>{picked.o=w;step='extra'})}
 if(step==='extra'){const e=l.extras.find(e=>e[0]===w);if(e)success(btn,()=>{extra=e;step='recall';revealed=false})}
}
function showRecall(){const l=lessonData();app.innerHTML=header()+`<section class="hero"><div class="hero-label">입으로 마무리하기</div><h1>${safe(l.ko)}</h1></section><section class="question-area recall-area"><div class="step-info"><span class="step-dot"></span>말하기</div><h2>영어 문장을 가리고<br>직접 말해보세요.</h2><p class="muted">천천히 말해도 괜찮아요. 필요한 만큼 생각한 다음 정답을 확인해 보세요.</p>${revealed?`<div class="reveal-card"><strong>${safe(quote())}</strong><p>${extra?'추가정보: '+safe(extra[1]):'기본 문장'}</p></div><button type="button" class="utility" style="width:100%;margin-bottom:12px" data-action="speak">▶ 발음 듣기</button><button type="button" class="primary" data-action="finish">문장 완성 ✓</button>`:'<button type="button" class="primary standalone" data-action="reveal">정답 확인하기</button>'}</section>`}
function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(quote());utter.lang='en-US';utter.rate=.82;window.speechSynthesis.speak(utter)}
function finish(){touchAttempt('finished','completed');const arr=dayResults().slice();arr[lesson]=quote();progress.sentences[day+1]=arr;sync();enqueueCloud({kind:'record',lesson_day:day+1,lesson_type:lesson===0?'be':'general',mistakes,completed_at:new Date().toISOString()});step='done';audioGood();render()}
function completedLesson(){const isLast=lesson===1;const l=lessonData();const result=dayResults()[lesson];app.innerHTML=header()+`<div class="done"><div class="success-icon" aria-hidden="true">✓</div><p class="done-kicker">${day+1}일차 · ${lesson===0?'be동사':'일반동사'}</p><h2>문장 완성!</h2><div class="result"><div class="minor">MY SENTENCE</div><div class="big-sentence">${safe(result)}</div></div><p class="translation">${safe(l.ko)}</p><button class="primary" data-action="next">${isLast?'오늘의 결과 보기':'두 번째 문장으로 →'}</button></div>`}
function feedbackForm(){return `<section class="feedback-panel"><h3>오늘 연습은 어땠나요?</h3><p class="muted" style="margin:0">의견은 학습 개선을 위해 저장돼요. 이름은 받지 않습니다.</p><div class="rating-group">${[['easy','쉬웠어요'],['good','적당해요'],['hard','어려웠어요']].map(([v,t])=>`<button type="button" class="rating-btn ${rating===v?'selected':''}" data-rating="${v}">${t}</button>`).join('')}</div><textarea id="feedback-comment" class="feedback-text" maxlength="250" placeholder="불편한 점이 있었다면 적어주세요. (선택)"></textarea><button class="send" data-action="send" ${!rating||sending?'disabled':''}>${sending?'전송 중…':'의견 보내기'}</button><div class="feedback-confirm" id="feedback-confirm" role="status" aria-live="polite"></div></section>`}
function dayComplete(){if(!progress.completed.includes(day+1)){progress.completed.push(day+1);sync()}const arr=dayResults();app.innerHTML=header()+`<section class="today-done"><div class="done-kicker" style="text-align:left">${day+1}일차 완료 · 총 ${progress.completed.length}/7일</div><h1>오늘 두 문장,<br>직접 만들었어요.</h1><div class="review-list">${arr.map((text,i)=>`<div class="review"><div class="review-label">${i===0?'① be동사':'② 일반동사'}</div><strong>${safe(text)}</strong></div>`).join('')}</div>${feedbackForm()}<button class="primary" data-action="day-next">${day<6?'다음 날 연습하기 →':'7일 연습 다시 시작하기'}</button><button class="secondary" data-action="day-repeat">오늘 문장 다시 연습</button></section>`}
function render(){if(step==='recall')return showRecall();if(step==='done')return completedLesson();if(step==='day-done')return dayComplete();return stage()}
function moveNext(){if(lesson===0){lesson=1;step='subject';picked={};extra=null;revealed=false;mistakes=0;render()}else{step='day-done';render()}}
function startDay(n){interruptAttempt();day=n;lesson=0;step='subject';picked={};extra=null;revealed=false;rating='';mistakes=0;render()}
async function submitFeedback(){
 if(sending||!rating)return;
 const msg=$('#feedback-comment')?.value?.trim()||'';
 const btn=$('[data-action="send"]'),notice=$('#feedback-confirm');
 if(progress.feedbackSent?.[day+1]){notice.textContent='이 날짜의 의견은 이미 접수했어요.';return}
 sending=true;btn.disabled=true;btn.textContent='저장 중…';
 enqueueCloud({kind:'feedback',category:`day${day+1}:${rating}`,lesson_day:day+1,rating,message:msg});
 // Local queue makes offline feedback durable. Confirmed server upload is separate.
 await flushCloud();
 progress.feedbackSent=progress.feedbackSent||{};
 progress.feedbackSent[day+1]=true;sync();
 notice.textContent=cloudQueue.some(x=>x.kind==='feedback')?'의견을 기기에 보관했어요. 인터넷 연결 시 자동 전송합니다.':'의견이 온라인에 저장됐어요. 감사합니다!';
 btn.textContent='의견 저장됨';sending=false;
}
$('#reset').addEventListener('click',()=>{
 // This intentionally resets only this browser's learning progression.
 // Previously uploaded cloud records (including unique first completions) remain intact.
 const agree=confirm('이 기기의 7일 학습 진도를 모두 초기화하고 1일차부터 다시 시작할까요?\n\n온라인에 이미 저장된 학습 기록은 삭제되지 않습니다.');
 if(!agree)return;
 interruptAttempt();
 progress.completed=[];
 progress.sentences={};
 progress.feedbackSent={};
 sync();
 startDay(0);
});
app.addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn||busy)return;if(btn.dataset.choice!==undefined)return pick(btn,btn.dataset.choice);if(btn.dataset.rating){rating=btn.dataset.rating;const keep=$('#feedback-comment')?.value||'';const savedScroll=window.scrollY;dayComplete();$('#feedback-comment').value=keep;window.scrollTo({top:savedScroll});return}
const a=btn.dataset.action;
if(a==='no-extra'){beginAttempt();extra=null;step='recall';revealed=false;touchAttempt(step);return render()}
if(a==='reveal'){revealed=true;touchAttempt('reveal');return render()}
if(a==='speak')return speak();
if(a==='finish')return finish();
if(a==='next')return moveNext();
if(a==='send')return submitFeedback();
if(a==='day-next'){const next=day===6?0:day+1;return startDay(next)}
if(a==='day-repeat')return startDay(day);
});
// On reload, if today's first sentence is saved, resume with the second sentence.
if(dayResults().length===2)step='day-done';
render();
void startCloud();
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow"><title>주동목 — 튜토리얼</title><style>
:root{color-scheme:light;--blue:#235BFA;--blue-dark:#1245D4;--navy:#121D36;--muted:#76829A;--border:#DFE6F1;--pale:#F2F6FF;--surface:#F7F9FD;--success:#0D9B70;--wrong:#C7464A}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100vh;background:#f0f3fa;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;color:var(--navy);font-size:18px;letter-spacing:-.04em}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #88AAFF;outline-offset:3px}button:disabled{cursor:default}
.screen{background:#fff;max-width:535px;min-height:100dvh;margin:0 auto;position:relative;box-shadow:0 26px 75px rgba(21,36,77,.09);display:flex;flex-direction:column}
.header{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #F0F3F8;flex-shrink:0}
.logo{font-weight:900;letter-spacing:-.07em;font-size:26px;display:flex;align-items:center;gap:9px}
.logo-mark{display:grid;grid-template-columns:repeat(3,6px);gap:3px;align-items:end;height:20px;width:26px;transform:rotate(-9deg)}
.logo-mark i{display:block;width:6px;height:11px;background:var(--blue);border-radius:2px}.logo-mark i:nth-child(2){height:20px}.logo-mark i:nth-child(3){height:15px}
.top-action{border:0;background:transparent;color:#8994A9;font-size:15px;font-weight:700;padding:12px 3px}
main{flex:1;display:flex;flex-direction:column;padding:0 30px 34px;min-width:0}
.progress-wrap{padding-top:25px}
.progress-heading{display:flex;justify-content:space-between;align-items:center;color:#7B869B;font-size:14px;font-weight:700;letter-spacing:0}
.progress-heading b{color:var(--blue);font-size:15px}
.progress-bar{display:flex;gap:7px;margin-top:13px}
.progress-segment{height:7px;border-radius:8px;flex:1;background:#E6EBF3;overflow:hidden}
.progress-segment span{display:block;height:100%;width:0;background:var(--blue);border-radius:8px;transition:width .34s cubic-bezier(.15,.65,.3,1)}
.hero{padding-top:47px}
.hero-label{font-size:14px;color:var(--blue);font-weight:850;letter-spacing:.02em;margin-bottom:15px}
.hero h1{font-size:clamp(28px,6.5vw,35px);line-height:1.46;letter-spacing:-.065em;margin:0;font-weight:850;word-break:keep-all;color:#111A30}
.board{margin-top:34px;background:var(--pale);border:1px solid #E4ECFF;border-radius:15px;padding:21px 19px 19px;min-height:145px}
.board-heading{font-size:13px;font-weight:800;color:#6C83BB;letter-spacing:0;margin-bottom:16px}
.slots{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}
.slot{min-width:73px;border:1px solid #D4DEF7;background:#fff;border-radius:9px;padding:10px 11px 11px;transition:background .2s,border .2s,transform .18s}
.slot-label{font-size:12px;font-weight:700;color:#98A4BC;letter-spacing:0;margin-bottom:5px;line-height:1}
.slot-word{font-size:23px;letter-spacing:-.025em;font-weight:850;line-height:1.2;white-space:nowrap;color:#C0CADD}
.slot.filled{border-color:#BBCFFF;background:white;animation:pop .22s ease-out both}
.slot.filled .slot-word{color:var(--blue)}
.slot.extra{background:#E8F0FF;border-color:#B8CFFF}.slot.extra .slot-word{font-size:17px}
.question-area{margin-top:38px;min-width:0}
.step-info{display:flex;align-items:center;gap:8px;font-size:14px;color:#71819A;font-weight:750;letter-spacing:0;margin-bottom:10px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.question-area h2{font-size:28px;letter-spacing:-.065em;line-height:1.32;font-weight:850;margin:0 0 24px;word-break:keep-all}
.answers{display:grid;gap:12px}
.answer{min-height:84px;width:100%;border:1.5px solid #E1E7F1;border-radius:12px;background:#fff;padding:15px 17px;text-align:left;display:flex;align-items:center;gap:15px;color:var(--navy);transition:background .15s,border .15s,transform .12s,box-shadow .15s}
.answer:hover{border-color:#97B3FA;background:#FBFCFF;box-shadow:0 5px 20px rgba(24,72,179,.055)}
.answer:active{transform:scale(.991)}
.answer-no{border:1px solid #DCE4F1;background:#F8FAFD;color:#7D8BA4;font-size:14px;font-weight:850;width:33px;height:33px;border-radius:8px;flex:none;display:grid;place-items:center;letter-spacing:0}
.answer-content{display:flex;min-width:0;flex:1;flex-direction:column;gap:4px}
.answer-name{font-size:24px;font-weight:850;letter-spacing:-.045em;line-height:1.1;overflow-wrap:anywhere}
.answer-meaning{font-size:15px;font-weight:650;color:#8590A4;line-height:1.25}
.answer svg{color:#CBD5E4;flex-shrink:0}
.answer.correct{background:#EEF9F5;border-color:#49BB91}.answer.correct .answer-no{background:var(--success);border-color:var(--success);color:white}.answer.correct .answer-name{color:#066F50}
.answer.wrong{border-color:#E99A9C;background:#FFF7F7}.answer.wrong .answer-no{color:var(--wrong);border-color:#E99A9C}
.feedback{min-height:33px;margin-top:14px;font-size:16px;font-weight:750;color:var(--success);line-height:1.4}
.feedback.wrong{color:var(--wrong)}
.skip{border:0;background:transparent;color:#77859B;font-size:16px;font-weight:750;text-decoration:underline;text-underline-offset:4px;display:block;margin:18px auto 0;padding:9px 15px}
.bottom-note{font-size:13px;color:#A1A9B7;text-align:center;padding:17px 16px 23px;flex-shrink:0;letter-spacing:0}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:520px;position:relative;padding:28px 0 10px}
.success-icon{margin:0 auto 21px;border-radius:50%;height:78px;width:78px;display:grid;place-items:center;background:#EAF8F2;color:var(--success);position:relative;animation:pop .38s both}
.success-icon:after{position:absolute;content:"";width:94px;height:94px;border:1.5px solid #BEEBD5;border-radius:50%;animation:ring .6s both}
.done-kicker{text-align:center;color:var(--success);font-size:15px;font-weight:850;margin:0 0 9px;letter-spacing:.02em}
.done h2{font-size:34px;letter-spacing:-.07em;text-align:center;margin:0 0 36px;font-weight:850;line-height:1.3}
.result{border-radius:15px;background:var(--blue);color:white;padding:30px 28px;box-shadow:0 15px 30px rgba(35,91,250,.16);overflow-wrap:anywhere;position:relative}
.result::after{content:'';position:absolute;border:1px solid rgba(255,255,255,.12);width:185px;height:185px;border-radius:50%;right:-85px;top:-112px}
.result .minor{font-size:13px;color:#D9E4FF;font-weight:750;letter-spacing:.07em;margin-bottom:14px}
.result .big-sentence{font-size:clamp(29px,5.6vw,39px);font-weight:800;line-height:1.45;letter-spacing:-.045em}
.result .big-sentence em{font-style:normal;color:#D0F4FF}
.translation{font-size:16px;line-height:1.5;color:#76849B;margin:17px 1px 25px;text-align:center}
.extra-actions{display:flex;gap:10px;margin:0 0 16px}
.utility{background:#fff;border:1px solid #DCE4F1;border-radius:11px;flex:1;font-size:16px;font-weight:750;color:#3A4C6D;min-height:55px;display:flex;align-items:center;gap:8px;justify-content:center}
.utility svg{height:20px;width:20px;stroke-width:2}
.primary{width:100%;min-height:66px;background:var(--blue);color:#fff;border:0;border-radius:12px;font-size:21px;font-weight:850;letter-spacing:-.04em;box-shadow:0 7px 18px rgba(35,91,250,.17);transition:transform .15s,background .15s}
.primary:hover{background:var(--blue-dark)}.primary:active{transform:scale(.985)}
.recap{padding-top:45px}.recap-head{font-size:33px;letter-spacing:-.06em;margin:14px 0 29px}.recap-sub{color:var(--blue);font-size:14px;font-weight:850}
.recap-line{padding:22px 0;border-bottom:1px solid #E8EDF4}.recap-line small{color:#8A98AA;font-weight:800;font-size:14px}.recap-line strong{display:block;font-size:23px;line-height:1.45;letter-spacing:-.045em;margin-top:8px;overflow-wrap:anywhere}
.recap .primary{margin-top:35px}
@keyframes pop{0%{transform:scale(.89);opacity:.35}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{transform:scale(.65);opacity:.1}100%{transform:scale(1);opacity:1}}
@media(max-width:550px){body{background:#fff}.screen{box-shadow:none}.header{padding:0 22px;height:70px}main{padding:0 22px 22px}.progress-wrap{padding-top:21px}.hero{padding-top:40px}.hero h1{font-size:30px}.board{margin-top:28px}.question-area{margin-top:35px}.question-area h2{font-size:27px;margin-bottom:21px}.answer{min-height:80px}.done{min-height:480px}}
@media(max-width:380px){main{padding-left:17px;padding-right:17px}.header{padding:0 17px}.hero h1{font-size:28px}.board{padding:18px 14px}.slot{padding:9px;min-width:67px}.question-area{margin-top:29px}.question-area h2{font-size:25px}.answer{min-height:75px;padding:12px}.answer-name{font-size:22px}}
@media(min-width:560px){.screen{min-height:790px;margin:36px auto;border:1px solid #E5EAF2;border-radius:21px;overflow:hidden}.bottom-note{padding-bottom:20px}}
.privacy-link{color:#7B86A0;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* Only the minimum styles needed to extend the original v08 UI */
.intro{padding-top:clamp(110px,20dvh,210px)}
.intro h1{font-size:clamp(29px,6.3vw,35px);font-weight:850;line-height:1.5;letter-spacing:-.065em;word-break:keep-all;margin:0 0 38px;color:#111A30;opacity:0;animation:appear .55s ease forwards .16s}
.intro .answer{opacity:0;animation:appear .4s ease forwards}
.intro .answer:nth-child(1){animation-delay:.64s}
.intro .answer:nth-child(2){animation-delay:.96s}
.intro .answer:nth-child(3){animation-delay:1.28s}
@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.hero.korean-hero h1{display:flex;gap:.18em;flex-wrap:wrap;align-items:center}
.korean-token{display:inline;padding:1px 3px;border-radius:6px;transition:background .18s,color .18s}
.korean-token.lit{background:#FFE27A;color:#1E2540;box-shadow:0 0 0 2px rgba(255,211,63,.22)}
.board{min-height:0}
.slot{min-width:73px}
.question-area{margin-top:31px}
.question-area h2{font-size:26px}
.answer{min-height:73px}
.answer-name{font-size:22px}
.done{min-height:0;justify-content:center}
@media(max-width:550px){.intro{padding-top:clamp(100px,18dvh,170px)}.question-area h2{font-size:25px}.answer{min-height:73px}}
@media(prefers-reduced-motion:reduce){.intro h1,.intro .answer{animation:none;opacity:1}}
</style></head><body><div class="screen"><header class="header"><div class="logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>주동목</div></header><main id="app"></main></div><script>
(()=>{'use strict';
const app=document.querySelector("#app");
const s=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const choices=(items)=>items.map((w,i)=>'<button class="answer" data-choice="'+i+'" type="button"><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+s(w)+'</span></span></button>').join("");
let scene="intro",mode="guided",step=0,lock=false,picked={},extra="",wrong=false;
const sentence=["나는","밥을","먹는다."];
const steps=[
 {key:"subject",part:0,tag:"주어",question:"여기서 주어가 뭘까요?",opts:["I","You"],correct:0,value:"I",help:"맞습니다!"},
 {key:"verb",part:2,tag:"동사",question:"여기서 동사는 뭘까요?",opts:["eat","drink"],correct:0,value:"eat",help:"맞습니다!"},
 {key:"need",part:1,tag:"목적어",question:"eat은 목적어가 꼭 필요할까요?",opts:["필요하다","필요하지 않다","넣어도 되고 안 넣어도 된다"],correct:2,value:null,help:"맞습니다! 목적어 없이도 쓸 수 있어요."},
 {key:"object",part:1,tag:"목적어",question:"'밥을' 영어로 골라보세요.",opts:["water","rice"],correct:1,value:"rice",help:"맞습니다!"},
 {key:"extra",part:-1,tag:"추가정보",question:"한 가지 더 붙여볼까요?",opts:["at home","every day"],correct:-1,value:null,help:"좋아요!"}
];
function playTone(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const c=new Audio(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(500,c.currentTime);o.frequency.linearRampToValueAtTime(750,c.currentTime+.12);g.gain.setValueAtTime(.015,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);o.onended=()=>c.close();}catch(e){}}
function korean(){
 const q=steps[step];
 const lit=i=>mode==="guided"?i===q.part:((i===0&&picked.subject)||(i===2&&picked.verb)||(i===1&&picked.object));
 return sentence.map((w,i)=>'<span class="korean-token'+(lit(i)?" lit":"")+'">'+s(w)+'</span>').join('');
}
function board(){
 const slots=[["주어",picked.subject],["동사",picked.verb],["목적어",picked.object]];
 if(extra)slots.push(["추가정보",extra]);
 return '<div class="board"><div class="board-heading">내가 조립한 문장</div><div class="slots">'+slots.map(([label,val])=>'<div class="slot '+(val?"filled":"")+' '+(label==="추가정보"?"extra":"")+'"><div class="slot-label">'+label+'</div><div class="slot-word">'+(val?s(val):"···")+'</div></div>').join("")+'</div></div>';
}
function render(){
 if(scene==="intro"){
 app.innerHTML='<section class="intro"><h1>영어와 한국어는<br>어순이 다르다는 사실,<br>알고 계셨나요?</h1><div class="answers">'+choices(["알고 있어요","느낌은 알지만 헷갈려요","잘 모르겠어요"])+'</div></section>';
 return;
 }
 if(scene==="done"){
 const full="I eat rice"+(extra?" "+extra:"")+".";
 app.innerHTML='<section class="done"><div class="success-icon" aria-hidden="true">✓</div><p class="done-kicker">🎉 잘했어요!</p><h2>문장 완성!</h2><div class="result"><div class="minor">MY SENTENCE</div><div class="big-sentence">'+s(full)+'</div></div><p class="translation">나는 밥을 먹는다.</p><button class="primary" data-action="restart">다시 해보기</button></section>';
 return;
 }
 const q=steps[step];
 app.innerHTML='<section class="hero korean-hero"><h1>'+korean()+'</h1></section>'+board()
 +'<section class="question-area"><div class="step-info"><span class="step-dot"></span>'+q.tag+'</div><h2>'+s(q.question)+'</h2><div class="answers">'+choices(q.opts)+'</div><p class="feedback" id="feedback" aria-live="polite"></p></section>';
}
function select(i,button){
 if(lock)return;
 if(scene==="intro"){
  // Knowing the rule = no hint until a correct choice; other answers = highlighted guidance.
  mode=i===0?"independent":"guided";
  scene="learn";step=0;picked={};extra="";render();return;
 }
 if(scene!=="learn")return;
 const q=steps[step], right=q.correct<0||i===q.correct;
 const feedback=document.querySelector("#feedback");
 if(!right){button.classList.add("wrong");feedback.classList.add("wrong");feedback.textContent="다시 골라보세요.";setTimeout(()=>button.classList.remove("wrong"),450);return;}
 lock=true;app.querySelectorAll(".answer").forEach(el=>el.disabled=true);
 button.classList.add("correct");
 button.querySelector(".answer-no").textContent="✓";
 if(q.value)picked[q.key]=q.value;
 if(q.key==="extra")extra=q.opts[i];
 // In independent mode, only after the answer is correct does the Korean word light up.
 if(q.part>=0){
   let token=app.querySelectorAll(".korean-token")[q.part];
   if(token)token.classList.add("lit");
 }
 if(q.value||extra)app.querySelector(".board").outerHTML=board();
 feedback.classList.remove("wrong");feedback.textContent=q.help;
 playTone();try{navigator.vibrate?.(15)}catch(e){}
 setTimeout(()=>{step++;scene=step===steps.length?"done":"learn";lock=false;render();window.scrollTo(0,0)},560);
}
app.addEventListener("click",e=>{
 const button=e.target.closest("button");if(!button)return;
 if(button.hasAttribute("data-choice"))select(Number(button.dataset.choice),button);
 else if(button.dataset.action==="restart"){scene="intro";step=0;lock=false;picked={};extra="";mode="guided";render();}
});
render();
})();
</script></body></html>

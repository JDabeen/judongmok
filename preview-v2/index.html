@keyframes celebrate-fly{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.8)}
 35%{opacity:1}

</style></head><body><div class="screen"><header class="header"><div class="logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>주동목</div></header><main id="app"></main></div><script>
(()=>{'use strict';
const app=document.querySelector("#app");
const s=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const choices=(items)=>items.map((w,i)=>'<button class="answer" data-choice="'+i+'" type="button"><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+s(w)+'</span></span></button>').join("");
let scene="intro",mode="guided",step=0,lock=false,picked={},extra="",wrong=false,challenge=false;
let audioContext=null;
const sentence=["나는","밥을","먹는다."];
const challengeSentence=["나는","물을","마신다."];
const steps=[
 {key:"subject",part:0,tag:"주어",question:"주어는 무엇일까요?",opts:["I","You"],correct:0,value:"I",help:"맞습니다!"},
 {key:"verb",part:2,tag:"동사",question:"동사는 무엇일까요?",opts:["eat","drink"],correct:0,value:"eat",help:"맞습니다!"},
 {key:"need",part:1,tag:"목적어",question:"목적어가 필요할까요?",opts:["필요해요","필요 없어요","둘 다 돼요"],correct:2,value:null,help:"둘 다 가능해요."},
 {key:"object",part:1,tag:"목적어",question:"밥을 영어로?",opts:["water","rice"],correct:1,value:"rice",help:"맞습니다!"},
 {key:"extra",part:-1,tag:"추가정보",question:"한 가지 더 붙여볼까요?",opts:["at home","every day"],correct:-1,value:null,help:"좋아요!"}
];
const challengeWords=["water","I","drink"];
const challengeOrder=["I","drink","water"];
const challengeParts=[0,2,1];
const currentSteps=()=>steps;
function playTone(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const c=new Audio(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(500,c.currentTime);o.frequency.linearRampToValueAtTime(750,c.currentTime+.12);g.gain.setValueAtTime(.015,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);o.onended=()=>c.close();}catch(e){}}

function unlockAudio(){
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
 if(!audioContext)audioContext=new A();
 if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
 return audioContext;
 }catch(e){return null;}
}
function victorySound(){
 const c=unlockAudio();if(!c||c.state==="closed")return;
 const notes=[523.25,659.26,783.99,1046.5,1318.51];
 const start=c.currentTime+.025;
 notes.forEach((freq,i)=>{
  const o=c.createOscillator(),g=c.createGain(),at=start+i*.105;
  o.type=i===4?"sine":"triangle";o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.035,at+.022);
  g.gain.exponentialRampToValueAtTime(.0001,at+.34);
  o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+.36);
 });
}
function celebrate(){
 if(window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches)return;
 const screen=document.querySelector(".screen");
 screen.querySelector(".celebrate-layer")?.remove();
 const overlay=document.createElement("div");overlay.className="celebrate-layer";overlay.setAttribute("aria-hidden","true");
 const colors=["#235BFA","#FFD44D","#15B786","#FE779E","#9F7BFF","#5DCFE3"];
 const fragment=document.createDocumentFragment();
 for(let i=0;i<108;i++){
  const el=document.createElement("i");el.className="celebrate-bit";
  const theta=Math.random()*2*Math.PI,radius=130+Math.random()*430;
  el.style.background=colors[i%colors.length];
  el.style.borderRadius=Math.random()>.65?"50%":"1px";
  el.style.setProperty("--dx",(Math.cos(theta)*radius).toFixed(1)+"px");
  el.style.setProperty("--dy",(Math.sin(theta)*radius+Math.random()*400).toFixed(1)+"px");
  el.style.setProperty("--turn",(Math.random()*1250-625).toFixed(0)+"deg");
  el.style.setProperty("--delay",(Math.random()*220).toFixed(0)+"ms");
  el.style.setProperty("--time",(1600+Math.random()*900).toFixed(0)+"ms");
  fragment.appendChild(el);
 }
 overlay.appendChild(fragment);screen.appendChild(overlay);
 setTimeout(()=>overlay.remove(),2900);
}
function pronounce(){
 if(!("speechSynthesis" in window)){alert("이 기기는 영어 음성 재생을 지원하지 않아요.");return;}
 window.speechSynthesis.cancel();
 const sentence=challenge?"I drink water.":"I eat rice"+(extra?" "+extra:"")+".";
 const u=new SpeechSynthesisUtterance(sentence);
 u.lang="en-US";u.rate=.86;u.pitch=1;
 const voices=window.speechSynthesis.getVoices();
 const preferred=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.toLowerCase().startsWith("en"));
 if(preferred)u.voice=preferred;
 const b=document.querySelector('[data-action="listen"]');
 u.onstart=()=>{if(b)b.textContent="🔊 듣는 중...";};
 const restore=()=>{if(b)b.textContent="🔊 문장 듣기";};
 u.onend=restore;u.onerror=restore;
 window.speechSynthesis.speak(u);
}
async function shareSentence(){
 const sentence=challenge?"I drink water.":"I eat rice"+(extra?" "+extra:"")+".";
 const text="오늘 주동목에서 내가 만든 문장!\n"+sentence+"\nhttps://splendorous-mochi-346e26.netlify.app/preview-v2/";
 if(navigator.share){try{await navigator.share({title:"주동목 · 오늘의 문장",text});}catch(e){}return;}
 try{await navigator.clipboard.writeText(text);alert("문장을 복사했어요. 카톡에 붙여넣어 보세요.");}
 catch(e){alert("이 기기에서는 자동 복사를 지원하지 않아요.");}
}

function korean(){
 const q=currentSteps()[step];
 const lit=i=>mode==="guided"?i===q.part:((i===0&&picked.subject)||(i===2&&picked.verb)||(i===1&&picked.object));
 return (challenge?challengeSentence:sentence).map((w,i)=>'<span class="korean-token'+(lit(i)?" lit":"")+'">'+s(w)+'</span>').join('');
}
function board(){
 const slots=[["주어",picked.subject],["동사",picked.verb],["목적어",picked.object]];
 if(extra&&!challenge)slots.push(["추가정보",extra]);
 return '<div class="board"><div class="slots">'+slots.map(([label,val])=>'<div class="slot '+(val?"filled":"")+' '+(label==="추가정보"?"extra":"")+'"><div class="slot-word">'+(val?s(val):"···")+'</div></div>').join("")+'</div></div>';
}

function showChallenge(){
 const used=new Set(Object.values(picked));
 const koreanWords=challengeSentence.map((w,i)=>'<span class="korean-token'+(challengeParts.slice(0,step).includes(i)?" lit":"")+'">'+s(w)+'</span>').join("");
 const words=challengeWords.map((word,i)=>'<button class="answer'+(used.has(word)?" correct":"")+'" data-challenge="'+i+'" type="button"'+(used.has(word)?" disabled":"")+'><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+word+'</span></span></button>').join("");
 app.innerHTML='<section class="hero korean-hero"><h1>'+koreanWords+'</h1></section>'+board()+
  '<section class="question-area"><h2>영어 순서대로 눌러보세요.</h2><div class="answers">'+words+'</div><p class="feedback" id="feedback" aria-live="polite"></p></section>';
}
function chooseChallenge(index,button){
 if(lock||scene!=="challenge"||!button||button.disabled)return;
 const word=challengeWords[index];
 if(word!==challengeOrder[step]){
  button.classList.add("wrong");
  const feedback=app.querySelector("#feedback");
  if(feedback){feedback.className="feedback wrong";feedback.textContent="다시 해볼까요?";}
  setTimeout(()=>button.classList.remove("wrong"),450);
  return;
 }
 unlockAudio();
 const key=["subject","verb","object"][step];
 picked[key]=word;step++;lock=true;
 button.classList.add("correct");
 if(step===challengeOrder.length){
  victorySound();try{navigator.vibrate?.([20,40,40])}catch(e){}
  setTimeout(()=>{scene="done";lock=false;render();window.scrollTo(0,0);},700);
 }else{
  playTone();try{navigator.vibrate?.(15)}catch(e){}
  setTimeout(()=>{lock=false;render();},280);
 }
}
function render(){
 if(scene==="intro"){
 app.innerHTML='<section class="intro"><h1>영어와 한국어는<br>어순이 다르다는 사실,<br>알고 계셨나요?</h1><div class="answers">'+choices(["알고 있어요","느낌은 알지만 헷갈려요","잘 모르겠어요"])+'</div></section>';
 return;
 }
 if(scene==="handoff"){
 app.innerHTML='<section class="intro"><h1>이번엔 힌트 없이<br>혼자 만들어볼까요?</h1><button class="primary" data-action="start-challenge">시작하기</button></section>';
 return;
 }
 if(scene==="challenge"){showChallenge();return;}
 if(scene==="done"){
 const full=challenge?"I drink water.":"I eat rice"+(extra?" "+extra:"")+".";
 const translation=challenge?"나는 물을 마신다.":extra==="at home"?"나는 집에서 밥을 먹는다.":extra==="every day"?"나는 매일 밥을 먹는다.":"나는 밥을 먹는다.";
 app.innerHTML='<section class="done"><div class="success-icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><p class="done-kicker">🎉 해냈어요!</p><h2>'+ (challenge?"혼자서도 만들었어요!":"첫 문장을 완성했어요!") +'</h2><div class="result"><div class="minor">내가 만든 영어 문장</div><div class="big-sentence">'+s(full)+'</div></div><p class="translation">'+s(translation)+'</p><div class="done-buttons"><button class="utility" data-action="listen">🔊 문장 듣기</button><button class="utility" data-action="share">↗ 공유</button></div><button class="primary" data-action="continue">'+(challenge?"처음부터 다시 하기":"다음 문장 만들기")+'</button></section>';
 requestAnimationFrame(()=>celebrate());
 return;
 }
 const q=currentSteps()[step];
 app.innerHTML='<section class="hero korean-hero"><h1>'+korean()+'</h1></section>'+board()
 +'<section class="question-area"><h2>'+s(q.question)+'</h2><div class="answers">'+choices(q.opts)+'</div><p class="feedback" id="feedback" aria-live="polite"></p></section>';
}
function select(i,button){
 if(lock)return;
 if(scene==="intro"){
  // Knowing the rule = no hint until a correct choice; other answers = highlighted guidance.
  mode=i===0?"independent":"guided";
  scene="learn";step=0;picked={};extra="";challenge=false;render();return;
 }
 if(scene!=="learn")return;
 const q=currentSteps()[step], right=q.correct<0||i===q.correct;
 const feedback=document.querySelector("#feedback");
 if(!right){button.classList.add("wrong");feedback.classList.add("wrong");feedback.textContent="다시 골라보세요.";setTimeout(()=>button.classList.remove("wrong"),450);return;}
 lock=true;app.querySelectorAll(".answer").forEach(el=>el.disabled=true);
 button.classList.add("correct");
 const marker=button.querySelector(".answer-no");if(marker)marker.textContent="✓";
 unlockAudio();
 if(q.value)picked[q.key]=q.value;
 if(q.key==="extra")extra=q.opts[i];
 // In independent mode, only after the answer is correct does the Korean word light up.
 if(q.part>=0){
   let token=app.querySelectorAll(".korean-token")[q.part];
   if(token)token.classList.add("lit");
 }
 if(q.value||extra)app.querySelector(".board").outerHTML=board();
 feedback.classList.remove("wrong");feedback.textContent=q.help;
 if(step===currentSteps().length-1){victorySound();} else {playTone();}
 try{navigator.vibrate?.(step===currentSteps().length-1?[20,40,40]:15)}catch(e){}
 setTimeout(()=>{step++;scene=step===currentSteps().length?"done":"learn";lock=false;render();window.scrollTo(0,0)},step===currentSteps().length-1?700:560);
}
app.addEventListener("click",e=>{
 const button=e.target.closest("button");if(!button)return;
 if(button.hasAttribute("data-choice"))select(Number(button.dataset.choice),button);
 else if(button.dataset.action==="continue"){
  window.speechSynthesis?.cancel();
  if(challenge){scene="intro";challenge=false;mode="guided";}
  else{scene="handoff";}
  step=0;lock=false;picked={};extra="";render();window.scrollTo(0,0);
 }
 else if(button.dataset.action==="start-challenge"){
  scene="challenge";challenge=true;mode="independent";step=0;picked={};extra="";lock=false;render();window.scrollTo(0,0);
 }
 else if(button.hasAttribute("data-challenge"))chooseChallenge(Number(button.dataset.challenge),button);
 else if(button.dataset.action==="listen"){pronounce();}
 else if(button.dataset.action==="share"){shareSentence();}
 else if(button.dataset.action==="restart"){scene="intro";step=0;lock=false;picked={};extra="";challenge=false;mode="guided";render();}
});
render();
})();
</script></body></html>

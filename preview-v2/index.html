function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){}}
function button(label,action,kind="primary"){return '<button type="button" class="'+kind+'" data-action="'+action+'">'+esc(label)+'</button>';}
function choices(items,kind="choice"){return items.map((w,i)=>'<button type="button" class="answer" data-kind="'+kind+'" data-index="'+i+'"><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+esc(w)+'</span></span></button>').join("");}
function board(parts,showLabels=false){
 return '<div class="board"><div class="slots">'+parts.map(([label,value])=>'<div class="slot '+(value?"filled":"")+' '+(label==="장소"||label==="시간"?"extra":"")+(showLabels?"":" no-label")+'">'+(showLabels?'<div class="slot-label">'+esc(label)+'</div>':"")+'<div class="slot-word">'+(value?esc(value):"···")+'</div></div>').join("")+'</div></div>';
}
function koTokens(words,lit=-1,seen=[]){return words.map((word,i)=>'<span class="korean-token '+(lit===i||seen.includes(i)?"lit":"")+'">'+esc(word)+'</span>').join("");}
function speak(text){
 if(!("speechSynthesis" in window))return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.87;
 const voices=window.speechSynthesis.getVoices();
 utterance.voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"))||null;
 window.speechSynthesis.speak(utterance);
}
async function share(){
 const text="오늘 주동목에서 만든 영어 문장!\n"+resultSentence+"\nhttps://splendorous-mochi-346e26.netlify.app/preview-v2/";
 if(navigator.share){try{await navigator.share({text,title:"주동목"});}catch(e){}return;}
 try{await navigator.clipboard.writeText(text);alert("문장을 복사했어요.");}catch(e){alert("공유 기능을 지원하지 않는 브라우저예요.");}
}
function playTone(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const c=new Audio(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(500,c.currentTime);o.frequency.linearRampToValueAtTime(750,c.currentTime+.12);g.gain.setValueAtTime(.015,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);o.onended=()=>c.close();}catch(e){}}

function unlockAudio(){
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
 if(!audioContext)audioContext=new A();
 if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
 return audioContext;
 }catch(e){return null;}
}
function victorySound(){
 const c=unlockAudio();if(!c||c.state==="closed")return;
 const notes=[523.25,659.26,783.99,1046.5,1318.51];
 const start=c.currentTime+.025;
 notes.forEach((freq,i)=>{
  const o=c.createOscillator(),g=c.createGain(),at=start+i*.105;
  o.type=i===4?"sine":"triangle";o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.035,at+.022);
  g.gain.exponentialRampToValueAtTime(.0001,at+.34);
  o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+.36);
 });
}
function celebrate(){
 if(window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches)return;
 const screen=document.querySelector(".screen");
 screen.querySelector(".celebrate-layer")?.remove();
 const overlay=document.createElement("div");overlay.className="celebrate-layer";overlay.setAttribute("aria-hidden","true");
 const colors=["#235BFA","#FFD44D","#15B786","#FE779E","#9F7BFF","#5DCFE3"];
 const fragment=document.createDocumentFragment();
 for(let i=0;i<108;i++){
  const el=document.createElement("i");el.className="celebrate-bit";
  const theta=Math.random()*2*Math.PI,radius=130+Math.random()*430;
  el.style.background=colors[i%colors.length];
  el.style.borderRadius=Math.random()>.65?"50%":"1px";
  el.style.setProperty("--dx",(Math.cos(theta)*radius).toFixed(1)+"px");
  el.style.setProperty("--dy",(Math.sin(theta)*radius+Math.random()*400).toFixed(1)+"px");
  el.style.setProperty("--turn",(Math.random()*1250-625).toFixed(0)+"deg");
  el.style.setProperty("--delay",(Math.random()*220).toFixed(0)+"ms");
  el.style.setProperty("--time",(1600+Math.random()*900).toFixed(0)+"ms");
  fragment.appendChild(el);
 }
 overlay.appendChild(fragment);screen.appendChild(overlay);
 setTimeout(()=>overlay.remove(),2900);
}

function finish(kind,english,korean){
 stage=kind;resultFrom=kind===4?"daily":"tutorial";resultSentence=english;resultKorean=korean;scene="done";locked=false;render();requestAnimationFrame(celebrate);
}
function tapEffect(last=false){unlockAudio();if(last)victorySound();else playTone();try{navigator.vibrate?.(last?[20,40,40]:15);}catch(e){}}
function feedbackRight(el,text){el.classList.add("correct");const mark=el.querySelector(".answer-no");if(mark)mark.textContent="✓";app.querySelectorAll(".answer").forEach(b=>b.disabled=true);const f=app.querySelector(".feedback");if(f)f.textContent=text||"잘했어요!";}
function feedbackWrong(el){el.classList.add("wrong");const f=app.querySelector(".feedback");if(f){f.classList.add("wrong");f.textContent="다시 해보세요.";}setTimeout(()=>el.classList.remove("wrong"),380);}
function resetStepState(){locked=false;step=0;picked={};sequence=0;}
function render(){
 if(scene==="intro"){app.innerHTML='<section class="intro"><h1>영어와 한국어는<br>어순이 다르다는 사실,<br>알고 계셨나요?</h1><div class="answers">'+choices(["알고 있어요","느낌은 알지만 헷갈려요","잘 모르겠어요"],"intro")+'</div></section>';return;}
 if(scene==="learn"){
  const q=stage1[step],lit=mode==="guided"?q.part:-1,seen=mode==="independent"?[picked.subject?0:-1,picked.verb?2:-1,picked.object?1:-1]:[];
  app.innerHTML='<section class="hero korean-hero"><h1>'+koTokens(base1,lit,seen)+'</h1></section>'+
   board([["주어",picked.subject],["동사",picked.verb],["목적어",picked.object]],true)+
   '<section class="question-area"><h2>'+esc(q.q)+'</h2><div class="answers">'+choices(q.opts,"learn")+'</div><p class="feedback" aria-live="polite"></p></section>';return;
 }
 if(scene==="handoff2"){app.innerHTML='<section class="intro"><h1>이번엔 혼자<br>만들어볼까요?</h1>'+button("시작하기","begin2")+'</section>';return;}
 if(scene==="challenge"){
  const chosen=stage2Correct.slice(0,sequence),filled=[["",chosen[0]],["",chosen[1]],["",chosen[2]]];
  app.innerHTML='<section class="hero korean-hero"><h1>'+koTokens(base2,-1,stage2Parts.slice(0,sequence))+'</h1></section>'+board(filled)+
   '<section class="question-area"><h2>영어 순서대로 눌러보세요.</h2><div class="answers">'+stage2Words.map((w,i)=>'<button type="button" class="answer '+(chosen.includes(w)?"correct":"")+'" data-kind="challenge" data-index="'+i+'" '+(chosen.includes(w)?"disabled":"")+'><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+esc(w)+'</span></span></button>').join("")+'</div><p class="feedback" aria-live="polite"></p></section>';return;
 }
 if(scene==="handoff3"){
  app.innerHTML='<section class="intro"><h1>이번엔 문장을<br>더 길게 만들어볼까요?</h1><div class="simple-line">I drink water.</div>'+button("시작하기","begin3")+'</section>';return;
 }
 if(scene==="extend"){
  const q=stage3Steps[step],base="I drink water"+(step>0?" at home":"")+".";
  app.innerHTML='<section class="hero korean-hero"><h1>'+koTokens(stage3Ko,q.part)+'</h1></section>'+
   '<div class="board sentence-board"><div class="sentence-line">'+esc(base)+'</div></div>'+
   '<section class="question-area"><h2>'+esc(q.q)+'</h2><div class="answers">'+choices(q.opts,"extend")+'</div><p class="feedback" aria-live="polite"></p></section>';return;
 }
 if(scene==="done"){
  const first=stage===1,second=stage===2,third=stage===3;
  const label=first?"첫 문장을 만들었어요!":second?"혼자서도 해냈어요!":third?"문장이 길어졌어요!":"오늘도 해냈어요!";
  const small=third?'<div class="compare-old">I drink water.</div>':'';
  app.innerHTML='<section class="done"><div class="success-icon" aria-hidden="true">✓</div><p class="done-kicker">🎉 잘했어요!</p><h2>'+label+'</h2>'+small+
  '<div class="result"><div class="big-sentence">'+esc(resultSentence)+'</div></div><p class="translation">'+esc(resultKorean)+'</p>'+
  '<div class="done-buttons"><button class="utility" data-action="listen">🔊 듣기</button><button class="utility" data-action="share">↗ 공유</button></div>'+
  button(stage===3?"학습 시작하기":stage===4?"홈으로":"다음 단계","next")+'</section>';return;
 }
 if(scene==="home"){renderHome();return;}
 if(scene==="daily"){renderDaily();return;}
 if(scene==="review"){renderReview();return;}
 if(scene==="catalog"){renderCatalog();return;}
}
function renderHome(){
 const finished=progress.day>=days.length,day=days[Math.min(progress.day,days.length-1)];
 const percent=Math.round(progress.day/days.length*100);
 app.innerHTML='<section class="home"><div class="home-label">나의 영어 연습</div><h1>오늘도 한 문장<br>만들어볼까요?</h1>'+
  '<div class="home-course"><div class="home-row"><span>초급 · 문장 만들기</span><strong>'+progress.day+' / 7일</strong></div>'+
  '<div class="home-progress"><span style="width:'+percent+'%"></span></div>'+
  (finished?'<p class="home-verb">7일 완성 🎉</p><p class="home-muted">배운 문장을 다시 떠올려보세요.</p>':
  '<div class="home-muted">오늘의 동사</div><div class="home-verb">'+esc(day.verb)+'</div><p class="home-muted">'+esc(day.longKo)+'</p>')+
  button(finished?"배운 문장 복습":"오늘의 연습 시작",finished?"review":"startDaily")+'</div>'+
  '<button class="home-link" data-action="review"><span>지난 문장 복습</span><span>›</span></button>'+
  '<button class="home-link" data-action="catalog"><span>다른 연습 둘러보기</span><span>›</span></button></section>';
}
function renderDaily(){
 const d=days[lessonIndex], built=d.order.slice(0,sequence),isExt=dailyPart===1;
 const korean=isExt?d.longKo:d.baseKo;
 const line=isExt?d.order.join(" ")+" ...":built.join(" ")||"···";
 const words=isExt?d.options:d.words;
 app.innerHTML='<section class="home lesson-head"><div class="home-label">초급 · '+(lessonIndex+1)+'일차</div><h1>'+esc(korean)+'</h1></section>'+
  '<div class="board sentence-board"><div class="sentence-line">'+esc(line)+'</div></div>'+
  '<section class="question-area"><h2>'+(isExt?"뒤에 붙여보세요.":"영어 순서대로 눌러보세요.")+'</h2>'+
  '<div class="answers">'+words.map((w,i)=>'<button type="button" class="answer '+(!isExt&&built.includes(w)?"correct":"")+'" data-kind="daily" data-index="'+i+'" '+(!isExt&&built.includes(w)?"disabled":"")+'><span class="answer-no">'+(i+1)+'</span><span class="answer-content"><span class="answer-name">'+esc(w)+'</span></span></button>').join("")+'</div><p class="feedback" aria-live="polite"></p></section>';
}
function renderReview(){
 app.innerHTML='<section class="subpage"><button class="back" data-action="home">‹ 홈</button><h1>지난 문장 복습</h1><p class="home-muted">한국어를 보고 영어로 말해보세요.</p>'+
 (progress.history.length?'<div class="review-list">'+progress.history.map((x,i)=>'<div class="review"><div class="review-label">'+(x.day+1)+'일차</div><strong>'+esc(x.ko)+'</strong>'+ (reviewShown.has(i)?'<div class="review-answer">'+esc(x.en)+'</div><button class="mini-link" data-action="review-speak" data-index="'+i+'">🔊 듣기</button>':'<button class="mini-link" data-action="reveal" data-index="'+i+'">정답 보기</button>')+'</div>').join("")+'</div>':
 '<div class="empty-state">아직 복습할 문장이 없어요.</div>')+'</section>';
}
function renderCatalog(){
 app.innerHTML='<section class="subpage"><button class="back" data-action="home">‹ 홈</button><h1>연습 둘러보기</h1>'+
  '<div class="catalog-item"><div><div class="home-label">초급</div><strong>기초 동사로 문장 만들기</strong><p>7일 · 짧은 문장부터 길게</p></div>'+button("연습하기",progress.day>=7?"review":"startDaily","small-blue")+'</div>'+
  '<div class="catalog-item disabled"><div class="home-label">중급</div><strong>문장 변형 연습</strong><p>준비 중</p></div>'+
  '<div class="catalog-item disabled"><div class="home-label">고급</div><strong>자연스러운 문장 구성</strong><p>준비 중</p></div></section>';
}
function clickChoice(kind,i,button){
 if(locked)return;
 if(kind==="intro"){mode=i===0?"independent":"guided";scene="learn";step=0;picked={};render();return;}
 if(kind==="learn"){
  const q=stage1[step];if(i!==q.correct){feedbackWrong(button);return;}
  locked=true;feedbackRight(button,q.reply);if(q.key)picked[q.key]=q.value;tapEffect(step===stage1.length-1);
  if(q.key){const b=app.querySelector(".board");if(b)b.outerHTML=board([["주어",picked.subject],["동사",picked.verb],["목적어",picked.object]],true);}
  setTimeout(()=>{step++;locked=false;if(step===stage1.length)finish(1,"I eat rice.","나는 밥을 먹는다.");else render();},step===stage1.length-1?670:500);return;
 }
 if(kind==="challenge"){
  const word=stage2Words[i];if(word!==stage2Correct[sequence]){feedbackWrong(button);return;}
  locked=true;sequence++;feedbackRight(button,"맞았어요!");tapEffect(sequence===stage2Correct.length);
  setTimeout(()=>{locked=false;if(sequence===stage2Correct.length)finish(2,"I drink water.","나는 물을 마신다.");else render();},sequence===stage2Correct.length?670:300);return;
 }
 if(kind==="extend"){
  const q=stage3Steps[step];if(i!==q.correct){feedbackWrong(button);return;}
  locked=true;feedbackRight(button,"좋아요!");tapEffect(step===stage3Steps.length-1);
  setTimeout(()=>{step++;locked=false;if(step===stage3Steps.length)finish(3,"I drink water at home every morning.","나는 집에서 매일 아침 물을 마신다.");else render();},step===stage3Steps.length-1?700:430);return;
 }
 if(kind==="daily"){
  const d=days[lessonIndex];
  if(dailyPart===0){
   if(d.words[i]!==d.order[sequence]){feedbackWrong(button);return;}
   locked=true;sequence++;feedbackRight(button,"좋아요!");tapEffect(false);
   setTimeout(()=>{locked=false;if(sequence===d.order.length){dailyPart=1;}render();},340);return;
  }
  if(d.options[i]!==d.add){feedbackWrong(button);return;}
  locked=true;feedbackRight(button,"완성!");tapEffect(true);
  if(!progress.history.some(x=>x.day===lessonIndex)){
   progress.history.push({day:lessonIndex,ko:d.longKo,en:d.order.join(" ")+" "+d.add+"."});
  }
  progress.day=Math.max(progress.day,lessonIndex+1);save();
  setTimeout(()=>finish(4,d.order.join(" ")+" "+d.add+".",d.longKo),680);
 }
}
function action(which,el){
 if(which==="begin2"){scene="challenge";resetStepState();render();}
 if(which==="begin3"){scene="extend";step=0;locked=false;render();}
 if(which==="next"){
  window.speechSynthesis?.cancel();
  if(stage===1){scene="handoff2";}
  else if(stage===2){scene="handoff3";}
  else{if(stage===3){progress.onboarded=true;save();}scene="home";}
  locked=false;render();window.scrollTo(0,0);
 }
 if(which==="startDaily"){lessonIndex=progress.day<7?progress.day:0;sequence=0;dailyPart=0;locked=false;scene="daily";render();window.scrollTo(0,0);}
 if(which==="review"){scene="review";reviewShown.clear();render();window.scrollTo(0,0);}
 if(which==="catalog"){scene="catalog";render();window.scrollTo(0,0);}
 if(which==="home"){scene="home";render();window.scrollTo(0,0);}
 if(which==="listen"){speak(resultSentence);}
 if(which==="share"){share();}
 if(which==="reveal"){reviewShown.add(Number(el.dataset.index));render();}
 if(which==="review-speak"){const x=progress.history[Number(el.dataset.index)];if(x)speak(x.en);}
}
app.addEventListener("click",e=>{
 const el=e.target.closest("button");if(!el||el.disabled)return;
 if(el.hasAttribute("data-kind"))clickChoice(el.dataset.kind,Number(el.dataset.index),el);
 else if(el.hasAttribute("data-action"))action(el.dataset.action,el);
});
render();
})();
</script></body></html>
